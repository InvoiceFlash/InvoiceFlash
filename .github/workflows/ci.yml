name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # TODO: admin/language/es_ES/mail/customer.php has a broken line 10 (bad quotes in the
      # translation) and does not parse. It is excluded here until it is fixed.
      - name: Lint every PHP file
        run: |
          find . -name '*.php' \
            -not -path './vqmod/vqcache/*' \
            -not -path './admin/language/es_ES/mail/customer.php' \
            -print0 | xargs -0 -n1 php -l > /dev/null
